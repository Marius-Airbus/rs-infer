[package]
name = "rsinfer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ORT-powered inference engine: embedding, rerank, zero-shot, PII pipelines"

[features]
default = []
ep-coreml = ["ort/coreml"]
ep-cuda = ["ort/cuda"]
ep-tensorrt = ["ort/tensorrt"]
ep-nvrtx = ["ort/nvrtx"]
# allow non-exact prebuilt binary match (e.g. cuda+tensorrt+nvrtx combos)
lax-ep-matching = ["ort/lax-feature-matching"]

[dependencies]
ort = { workspace = true, features = ["ndarray", "tracing"] }
tokenizers = { workspace = true }
hf-hub = { workspace = true }
ndarray = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
num_cpus = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
