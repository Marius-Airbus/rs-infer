[package]
name = "rsinfer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ORT-powered inference engine: embedding, rerank, zero-shot, PII pipelines"

[features]
default = ["download-binaries"]
# Link the prebuilt ONNX Runtime fetched at build time (every profile but OpenVINO).
download-binaries = ["ort/download-binaries", "ort/copy-dylibs", "ort/tls-native", "ort/api-27"]
ep-coreml = ["ort/coreml"]
ep-cuda = ["ort/cuda"]
ep-tensorrt = ["ort/tensorrt"]
ep-nvrtx = ["ort/nvrtx"]
# allow non-exact prebuilt binary match (e.g. cuda+tensorrt+nvrtx combos)
lax-ep-matching = ["ort/lax-feature-matching"]
# Intel OpenVINO: loads an onnxruntime-openvino build (>= 1.24) at runtime from
# ORT_DYLIB_PATH instead of linking ONNX Runtime; build with --no-default-features
# (`make cpu-openvino`, runtime libraries via scripts/fetch-openvino-runtime.sh).
ep-openvino = ["ort/openvino", "ort/load-dynamic", "ort/api-24"]

[dependencies]
ort = { workspace = true, features = ["ndarray", "tracing"] }
tokenizers = { workspace = true }
hf-hub = { workspace = true }
ndarray = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
num_cpus = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
