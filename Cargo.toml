[workspace]
resolver = "2"
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marius-brt/rs-infer"

[workspace.dependencies]
rsinfer-core = { path = "crates/core", default-features = false }
# How ONNX Runtime is linked is chosen by rsinfer-core's features
# (download-binaries by default, load-dynamic for OpenVINO).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing"] }
tokenizers = { version = "0.22" }
hf-hub = "0.5"
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tracing = "0.1"
base64 = "0.22"

[profile.release]
lto = "thin"
